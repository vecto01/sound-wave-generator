<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор звуковых волн</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключение библиотек -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>Генератор звуковых волн</h1>
            <button id="theme-toggle" aria-label="Переключить тему">🌙</button>
        </header>

        <main>
            <div class="wave-visualizer">
                <div class="loader-container">
                    <div class="moon-icon">🌙</div>
                    <div class="loader" id="loader"></div>
                    <div class="progress-bar"></div>
                    <p class="loader-text">Генерация звуковых волн...</p>
                    <!-- Анимация волны при загрузке -->
                    <canvas id="waveCanvas" class="loading-wave"></canvas>
                </div>
                <canvas id="waveCanvas" class="main-wave"></canvas>
            </div>

            <div class="controls">
                <div class="wave-type">
                    <label for="waveType">Тип волны:</label>
                    <select id="waveType">
                        <option value="sine">Синусоида</option>
                        <option value="triangle">Треугольник</option>
                        <option value="sawtooth">Пилообразная</option>
                        <option value="noise">Шум</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="frequency">Частота (Гц):</label>
                    <input type="range" id="frequency" min="20" max="2000" value="440">
                    <input type="number" id="frequencyNumber" min="20" max="2000" value="440" class="number-input">
                    <span id="frequencyValue">440</span>
                </div>

                <div class="control-group">
                    <label for="amplitude">Амплитуда:</label>
                    <input type="range" id="amplitude" min="0" max="1" step="0.01" value="0.5">
                    <input type="number" id="amplitudeNumber" min="0" max="1" step="0.01" value="0.5" class="number-input">
                    <span id="amplitudeValue">0.5</span>
                </div>

                <div class="control-group">
                    <label for="phase">Фаза:</label>
                    <input type="range" id="phase" min="0" max="360" value="0">
                    <input type="number" id="phaseNumber" min="0" max="360" value="0" class="number-input">
                    <span id="phaseValue">0</span>
                </div>

                <div class="audio-controls">
                    <button id="playPause">Play</button>
                    <button id="exportAudio">🔊 Экспорт аудио</button>
                    <button id="exportImage">🖼️ Экспорт изображения</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
